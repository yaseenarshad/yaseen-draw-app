# Release build: on a `v*` tag push (or manual dispatch with a tag), build the Mac dmg on a
# macOS runner and the Windows installer on a Windows runner, then attach both to the
# GitHub release for that tag (creating the release if it does not exist yet).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach assets to (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: desktop:build
            glob: desktop/dist-app/*.dmg
          - os: windows-latest
            script: desktop:build:win
            glob: desktop/dist-app/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          # No signing certificates in CI: ad-hoc mac build, unsigned Windows build.
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ matrix.glob }}
          fail_on_unmatched_files: true
